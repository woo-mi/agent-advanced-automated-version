<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent — Advanced Automated Version</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #FDFDFD;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font: inherit; background: none; border: none; cursor: pointer; }

  /* ---------- Left rail ---------- */
  .rail {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 48px;
    background: rgba(245, 245, 245, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-right: 1px solid #E6E6E6;
    z-index: 10;
  }
  .rail-logo {
    position: absolute;
    left: 4px; top: 8px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .rail-nav {
    position: absolute;
    left: 0; top: 59px;
    width: 48px;
    display: flex; flex-direction: column; align-items: center;
  }
  .rail-btn {
    width: 36px; height: 36px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    transition: background-color 0.12s ease;
  }
  .rail-btn:hover { background: #E9E9E9; }
  .rail-divider {
    position: absolute;
    left: 10px; top: 352px;
    width: 28px; height: 1px;
    background: rgba(15, 17, 40, 0.08);
  }
  .rail-search { position: absolute; left: 6px; top: 365px; }
  .rail-bell { position: absolute; left: 6px; bottom: 56px; }
  .bell-wrap { position: relative; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .bell-badge {
    position: absolute;
    top: -3px; right: -3px;
    min-width: 15px; height: 15px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 3px;
    border-radius: 6px;
    background: #F04438;
    border: 2px solid #FFFFFF;
    color: #FFFFFF;
    font-size: 9px; font-weight: 600; line-height: 100%;
  }
  .rail-avatar {
    position: absolute;
    left: 4px; bottom: 16px;
    width: 40px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .avatar-circle {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: #FBE6F5;
    border: 1px solid #E7B8DE;
    color: #9E168E;
    font-size: 11px; font-weight: 600; line-height: 16px;
    font-family: system-ui, sans-serif;
  }

  /* ---------- Main stage ---------- */
  .stage {
    position: absolute;
    left: 48px; right: 0; top: 0; bottom: 0;
    overflow: auto;
  }
  .content {
    position: absolute;
    top: 231px;
    left: 50%;
    transform: translateX(-50%);
    width: 840px;
    display: flex; flex-direction: column; align-items: center;
  }
  .headline {
    font-size: 24px;
    line-height: 48px;
    font-weight: 500;
    color: #15171B;
    text-align: center;
    height: 69px;
  }
  .headline-gap { height: 10px; }

  /* ---------- Prompt card ---------- */
  .prompt-wrap {
    position: relative;
    width: 764px;
    flex-shrink: 0;
  }
  .prompt-gradient {
    position: absolute;
    inset: -1px;
    border-radius: 25px;
    opacity: 0.55;
    background: linear-gradient(353deg, #5A56E8 35%, #43C6D8 100%);
    background: linear-gradient(353deg in oklab, oklab(58.1% 0.009 -0.229) 35%, oklab(80.4% -0.113 -0.093) 100%);
  }
  .prompt-card {
    position: relative;
    width: 764px; min-height: 120px;
    display: flex; flex-direction: column;
    gap: 14px;
    padding: 18px 12px 12px;
    border-radius: 24px;
    background: #FFFFFF;
    box-shadow: 0 1px 10px rgba(15, 17, 40, 0.06);
  }
  .prompt-input {
    flex: 1 1 auto;
    min-height: 26px;
    height: 26px;
    overflow: hidden;
    padding: 0 8px;
    border: none; outline: none;
    resize: none;
    background: transparent;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px; font-weight: 500;
    line-height: 26px;
    color: #15171B;
  }
  .prompt-input::placeholder { color: #8C8F96; font-weight: 500; }
  .prompt-controls {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  .controls-left { display: flex; align-items: center; gap: 8px; }
  .controls-right { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    width: 34px; height: 34px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    transition: background-color 0.12s ease;
  }
  .icon-btn:hover { background: #F2F2F5; }
  .chip-btn {
    height: 34px;
    flex-shrink: 0;
    display: flex; align-items: center;
    gap: 6px;
    padding: 0 12px;
    border-radius: 17px;
    transition: background-color 0.12s ease;
  }
  .chip-btn:hover { background: #F2F2F5; }
  .chip-label { font-size: 14px; font-weight: 500; line-height: 18px; color: #15171B; }
  .chip-label.secondary { color: #4A4D53; }
  .send-btn {
    width: 34px; height: 34px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: #EAEBEE;
    transition: background-color 0.15s ease;
    cursor: default;
  }
  .send-btn svg path { transition: stroke 0.15s ease; }
  .send-btn.active { background: #15171B; cursor: pointer; }
  .send-btn.active svg path { stroke: #FFFFFF; }

  /* ---------- Suggestion pills ---------- */
  .suggestions {
    display: flex; align-items: center; justify-content: center;
    gap: 12px;
    padding-top: 16px;
  }
  .pill {
    flex-shrink: 0;
    display: flex; align-items: center;
    gap: 10px;
    padding: 12px 22px;
    border-radius: 24px;
    border: 1px solid #E4E6EA;
    background: #FFFFFF;
    box-shadow: 0 1px 2px rgba(15, 17, 40, 0.04);
    font-size: 14px; font-weight: 500; line-height: 20px;
    color: #15171B;
    transition: background-color 0.12s ease;
  }
  .pill:hover { background: #FAFAFA; }
  .pill.active {
    background: #15171B;
    color: #FBFCFD;
  }
  .pill.active:hover { background: #15171B; }
  .pill.active svg [stroke]:not([stroke="none"]) { stroke: #FBFCFD; }
  .pill.active svg [fill]:not([fill="none"]) { fill: #FBFCFD; }

  /* ---------- Agent chip in composer (frame 2) ---------- */
  .agent-mode-chip {
    height: 32px;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 0 9px 0 7px;
    border-radius: 9999px;
    background: rgba(21, 23, 27, 0.08);
    border: 1px solid rgba(21, 23, 27, 0.28);
    font-family: system-ui, sans-serif;
    font-size: 14px; font-weight: 500;
    color: #15171B;
  }
  .agent-mode-chip.visible {
    display: flex;
    animation: chipIn 0.18s ease;
  }
  @keyframes chipIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  /* ---------- Agents section (frames 2 & 3) ---------- */
  .agents-section {
    display: none;
    width: 840px;
    padding-left: 84px;
    margin-top: 30px;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }
  .agents-section.visible {
    display: flex;
    animation: sectionIn 0.22s ease;
  }
  @keyframes sectionIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .agents-heading {
    font-size: 14px; font-weight: 500;
    line-height: 143%;
    color: #15171B;
  }
  .agents-chips {
    display: flex; align-items: flex-start;
    flex-wrap: wrap;
    gap: 12px;
    width: 719px;
  }
  .agent-chip {
    height: 32px;
    flex-shrink: 0;
    display: flex; align-items: center;
    padding: 0 14px;
    border-radius: 100px;
    border: 1px solid #D4D4D4;
    background: transparent;
    font-size: 13px; font-weight: 500; line-height: 16px;
    color: #404040;
    white-space: nowrap;
    transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .agent-chip:hover { background: #F0F0F0; }
  .agent-chip.selected {
    background: #E5E5E5;
    border-color: #A3A3A3;
    color: #171717;
  }
</style>
</head>

    <h1 class="headline">What's on your mind today, Woo-Mi?</h1>
    <div class="headline-gap"></div>

    <div class="prompt-wrap">
      <div class="prompt-gradient"></div>
      <div class="prompt-card">
        <textarea id="promptInput" class="prompt-input" rows="1" placeholder="Ask Wisdom about your data"></textarea>
        <div class="prompt-controls">
          <div class="controls-left">
            <button class="icon-btn" title="Attach">
              <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 5v14M5 12h14" fill="none" stroke="#4A4B5C" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="chip-btn" title="Domain">
              <span class="chip-label">Auto</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24">
                <path d="m6 9 6 6 6-6" fill="none" stroke="#8A8B9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="chip-btn" title="Mode">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
                <path d="M12 18V5" fill="none" stroke="#4A4B5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4" fill="none" stroke="#4A4B5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5" fill="none" stroke="#4A4B5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17.997 5.125a4 4 0 0 1 2.526 5.77" fill="none" stroke="#4A4B5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M18 18a4 4 0 0 0 2-7.464" fill="none" stroke="#4A4B5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517" fill="none" stroke="#4A4B5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6 18a4 4 0 0 1-2-7.464" fill="none" stroke="#4A4B5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6.003 5.125a4 4 0 0 0-2.526 5.77" fill="none" stroke="#4A4B5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="chip-label secondary">Thinking</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24">
                <path d="m6 9 6 6 6-6" fill="none" stroke="#8A8B9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div id="agentModeChip" class="agent-mode-chip">
              <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <circle cx="10" cy="10" r="6.944" fill="none" stroke="#15171B" stroke-width="1.5"/>
                <rect x="8.333" y="7.222" width="1.667" height="3.333" rx="0.75" fill="#15171B"/>
                <rect x="12.222" y="7.222" width="1.667" height="3.333" rx="0.75" fill="#15171B"/>
              </svg>
              Agent
            </div>
          </div>
          <div class="controls-right">
            <button class="icon-btn" title="Voice input">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
                <rect x="9" y="2" width="6" height="13" rx="3" fill="none" stroke="#4A4B5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" fill="none" stroke="#4A4B5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 19v3" fill="none" stroke="#4A4B5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button id="sendBtn" class="send-btn" title="Send">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24">
                <path d="M12 19V5" fill="none" stroke="#A6A8B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="m5 12 7-7 7 7" fill="none" stroke="#A6A8B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="suggestions">
      <button class="pill">
        <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M3.583 3.5L16.381 3.5C17.265 3.5 17.981 4.228 17.981 5.126L17.981 14.874C17.981 15.772 17.265 16.5 16.381 16.5L3.583 16.5C2.699 16.5 1.981 15.772 1.981 14.874L1.981 5.126C1.981 4.228 2.699 3.5 3.583 3.5Z" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 7L5.007 7M8 7L8.007 7M10.999 7L11.007 7" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Build Apps
      </button>
      <button id="runAgentsPill" class="pill">
        <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10" cy="10" r="6.944" fill="none" stroke="#666666" stroke-width="1.5"/>
          <rect x="8.333" y="7.222" width="1.667" height="3.333" rx="0.75" fill="#666666"/>
          <rect x="12.222" y="7.222" width="1.667" height="3.333" rx="0.75" fill="#666666"/>
        </svg>
        Run Agents
      </button>
      <button class="pill">
        <svg width="20" height="20" viewBox="20 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <rect x="22.468" y="3.056" width="15" height="11.472" rx="1.25" fill="none" stroke="#666666" stroke-width="1.5"/>
          <path d="M29.968 14.829V17.829" fill="none" stroke="#666666" stroke-width="1.5"/>
          <path d="M26.968 17.452H32.968" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M26.368 6.98V10.603M29.968 9.395V10.603M33.568 8.188V10.603" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Create Slides
      </button>
      <button class="pill">
        <svg width="20" height="20" viewBox="12 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M23.499 2C23.737 2 23.972 2.047 24.191 2.138C24.411 2.229 24.61 2.362 24.777 2.53L27.468 5.22C27.637 5.389 27.771 5.588 27.862 5.807C27.953 6.027 28.001 6.262 28 6.5M23.499 2L17.499 2C17.102 2 16.72 2.159 16.439 2.44C16.157 2.721 16 3.102 16 3.5L16 16.5C16 16.897 16.157 17.279 16.439 17.56C16.72 17.841 17.102 18 17.499 18L26.5 18C26.898 18 27.28 17.841 27.561 17.56C27.842 17.279 28 16.897 28 16.5L28 6.5M23.499 2L23.499 5.751C23.499 5.948 23.578 6.14 23.72 6.28C23.86 6.421 24.051 6.5 24.25 6.5L28 6.5M18.999 13.999L18.999 13.249M22 13.999L22 9.5M25 13.999L25 11.75" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Write Reports
      </button>
    </div>

    <div id="agentsSection" class="agents-section">
      <div class="agents-heading">Agents post findings to your feed. Start from one:</div>
      <div class="agents-chips">
        <button class="agent-chip" data-prompt="Create an agent named &quot;AWS Spike Alert&quot; that runs daily. Every run, scan AWS spend across services, compare it to the trailing 30-day baseline, and post a concise summary. Lead with any cost spikes and explain the likely driver.">Daily AWS Spike Alert</button>
        <button class="agent-chip" data-prompt="Create an agent named &quot;Region Capacity Watch&quot; that runs daily. Every run, review capacity utilization by region, compare it to its recent trend, and post a concise summary. Lead with regions nearing their limits and explain the likely driver.">Daily Region Capacity Watch</button>
        <button class="agent-chip" data-prompt="Create an agent named &quot;Top Customers&quot; that runs weekly. Every run, rank customers by revenue and usage growth, compare the list to last week, and post a concise summary. Lead with notable movers and explain what changed.">Weekly Top Customers</button>
        <button class="agent-chip" data-prompt="Create an agent named &quot;AWS Usage Spike&quot; that runs daily. Every run, review usage volume across AWS services, compare it to the trailing baseline, and post a concise summary. Lead with unusual spikes and explain the likely driver.">Daily AWS Usage Spike</button>
        <button class="agent-chip" data-prompt="Create an agent named &quot;P&amp;L Capacity&quot; that runs daily. Every run, review P&amp;L against capacity and utilization, compare them to their recent trend, and post a concise summary. Lead with anything anomalous and explain the likely driver.">Daily P&amp;L capacity</button>
      </div>
    </div>
  </div>
</main>

<script>
  const input = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const runAgentsPill = document.getElementById('runAgentsPill');
  const agentModeChip = document.getElementById('agentModeChip');
  const agentsSection = document.getElementById('agentsSection');
  const agentChips = Array.from(document.querySelectorAll('.agent-chip'));

  let typingTimer = null;
  let autoFilledValue = null; // last fully auto-filled prompt, to know if the user edited it

  function autosize() {
    input.style.height = '26px';
    input.style.height = input.scrollHeight + 'px';
  }
  function updateSend() {
    sendBtn.classList.toggle('active', input.value.trim().length > 0);
  }
  function cancelTyping() {
    if (typingTimer) { clearInterval(typingTimer); typingTimer = null; }
  }
  function setValue(v) {
    input.value = v;
    autosize();
    updateSend();
  }
  function typePrompt(text) {
    cancelTyping();
    setValue('');
    let i = 0;
    typingTimer = setInterval(() => {
      i = Math.min(i + 4, text.length);
      setValue(text.slice(0, i));
      if (i >= text.length) {
        cancelTyping();
        autoFilledValue = text;
      }
    }, 10);
  }
  function clearSelection() {
    agentChips.forEach(c => c.classList.remove('selected'));
  }
  function clearAutoPrompt() {
    const wasTyping = typingTimer !== null;
    cancelTyping();
    // only wipe the input if the user hasn't edited the auto-filled text
    if (wasTyping || (autoFilledValue !== null && input.value === autoFilledValue)) {
      setValue('');
    }
    autoFilledValue = null;
  }

  input.addEventListener('input', () => {
    autosize();
    updateSend();
  });

  runAgentsPill.addEventListener('click', () => {
    const active = runAgentsPill.classList.toggle('active');
    agentModeChip.classList.toggle('visible', active);
    agentsSection.classList.toggle('visible', active);
    if (!active) {
      clearSelection();
      clearAutoPrompt();
    }
  });

  agentChips.forEach(chip => {
    chip.addEventListener('click', () => {
      if (chip.classList.contains('selected')) {
        chip.classList.remove('selected');
        clearAutoPrompt();
        return;
      }
      clearSelection();
      chip.classList.add('selected');
      typePrompt(chip.dataset.prompt);
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && runAgentsPill.classList.contains('active')) {
      runAgentsPill.click();
    }
  });
</script>

</body>
</html>
